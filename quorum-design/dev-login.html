<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev sign in · Quorum</title>
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <main class="auth">
    <div class="auth-card">
      <div class="auth-brand">
        <svg class="mark" width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#3b4dd8"/>
          <circle cx="12.6" cy="16" r="5.4" fill="#fff"/>
          <circle cx="19.4" cy="16" r="5.4" fill="#fff" fill-opacity=".55"/>
        </svg>
        <span>Quorum</span>
      </div>
      <h1>Dev sign in</h1>
      <p class="sub">Prototype login — no email needed. New emails get an account on first sign-in; if you were invited to a team, you'll land on it. Remove before production.</p>
      <form id="pw-form" novalidate>
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" type="email" id="email" value="" autocomplete="username">
        </div>
        <div class="field">
          <label class="label" for="password">Password</label>
          <input class="input" type="password" id="password" placeholder="Enter admin password" autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>
      </form>
      <p class="auth-msg" id="msg" role="status" aria-live="polite"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supa.js?v=3"></script>
  <script>
  (function(){
    const form = document.getElementById('pw-form');
    const msg = document.getElementById('msg');
    const btn = form.querySelector('button[type=submit]');
    form.addEventListener('submit', async function(e){
      e.preventDefault();
      btn.disabled = true; btn.textContent = 'Signing in…'; msg.className = 'auth-msg';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const fail = function(m){ msg.textContent = m; msg.classList.add('err'); btn.disabled = false; btn.textContent = 'Sign in'; };
      let { error } = await supa.auth.signInWithPassword({ email, password });
      if (error) {
        // Prototype: no account yet → create one on the spot (no email confirmation).
        const up = await supa.auth.signUp({ email, password });
        if (up.error) { console.error(up.error); return fail(up.error.message || 'Sign-in failed'); }
        if (!up.data.session) return fail('Account created, but email confirmation is on. Turn off "Confirm email" in Supabase → Auth for the demo.');
      }
      const p = await currentProfile();
      location.href = (p && p.role === 'admin') ? 'admin.html' : 'team.html';
    });
  })();
  </script>
</body>
</html>
