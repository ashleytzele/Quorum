<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing you in… · Quorum</title>
<script src="theme.js?v=2"></script>
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <main class="auth">
    <div class="auth-card" style="text-align:center;">
      <svg class="mark" width="34" height="34" viewBox="0 0 32 32" aria-hidden="true" style="margin:0 auto 14px;"><rect width="32" height="32" rx="9" fill="#3b4dd8"/><circle cx="12.6" cy="16" r="5.4" fill="#fff"/><circle cx="19.4" cy="16" r="5.4" fill="#fff" fill-opacity=".55"/></svg>
      <p class="auth-msg" id="route-msg" role="status"><span style="display:inline-block;width:15px;height:15px;margin-right:8px;vertical-align:-2px;border:2px solid var(--accent-100);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;"></span>Signing you in…</p>
      <p style="margin-top:14px;"><a href="index.html" style="font-size:0.8125rem;color:var(--text-2);text-decoration:none;">Back to sign in</a></p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supa.js?v=3"></script>
  <script>
    // After the magic-link redirect, wait for supabase-js to process the token/code
    // in the URL (it's async), then route admins to admin.html and members to team.html.
    (async () => {
      let { data: { session } } = await supa.auth.getSession();
      if (!session) {
        session = await new Promise((resolve) => {
          const { data: sub } = supa.auth.onAuthStateChange((_e, s) => {
            if (s) { sub.subscription.unsubscribe(); resolve(s); }
          });
          setTimeout(() => resolve(null), 4000); // give the URL exchange time to finish
        });
      }
      if (!session) {
        document.getElementById('route-msg').textContent = 'Sign-in link could not be verified. Returning to login…';
        setTimeout(() => { location.href = 'index.html'; }, 1500);
        return;
      }
      const p = await currentProfile();
      location.href = (p && p.role === 'admin') ? 'admin.html' : 'team.html';
    })();
  </script>
</body>
</html>
