<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minutes · Quorum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="theme.js?v=2"></script>
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>

<!-- Control bar (not printed) -->
<div class="min-bar no-print">
  <div class="container">
    <div class="min-bar-top">
      <a class="brand" href="admin.html">
        <svg class="mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#3b4dd8"/>
          <circle cx="12.6" cy="16" r="5.4" fill="#fff"/>
          <circle cx="19.4" cy="16" r="5.4" fill="#fff" fill-opacity=".55"/>
        </svg>
        <span>Quorum</span>
      </a>
      <span class="context"><span class="team">Meeting minutes</span><span class="meeting">Draft &amp; export</span></span>
      <span class="spacer"></span>
      <div class="min-actions">
        <button class="btn btn-ghost" id="generate" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 8-8 8 8 0 0 1 5.7 2.4L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-8 8 8 8 0 0 1-5.7-2.4L4 16"/><path d="M4 20v-4h4"/></svg>
          Refresh preview
        </button>
        <button class="btn btn-ghost" id="print" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="6" y="13" width="12" height="8"/><path d="M6 17H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"/></svg>
          Print / Save PDF
        </button>
        <button class="btn btn-primary" id="finalize" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h17A1.5 1.5 0 0 1 22 4.5V8H2z"/><path d="m9 13 2 2 4-4"/></svg>
          Finalize &amp; archive
        </button>
      </div>
    </div>
    <div class="min-fields">
      <div class="field">
        <label class="label" for="min-org">Organization</label>
        <input class="input" type="text" id="min-org" value="">
      </div>
      <div class="field">
        <label class="label" for="min-title">Meeting title</label>
        <input class="input" type="text" id="min-title" value="">
      </div>
      <div class="field">
        <label class="label" for="min-date">Date</label>
        <input class="input" type="date" id="min-date" value="">
      </div>
      <div id="ai-wrap" class="ai-card" style="display:none;">
        <div class="ai-card-head">
          <div class="ai-card-title" role="heading" aria-level="2">
            <svg class="ai-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.6 15l.85 2.55L22 18.4l-2.55.85L18.6 21.8l-.85-2.55L15.2 18.4l2.55-.85z"/></svg>
            <span>Generate from Meetily</span>
            <span class="pill">AI</span>
          </div>
          <div class="ai-card-controls">
            <button class="btn btn-subtle" id="gen-ai" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
              Generate
            </button>
          </div>
        </div>
        <div class="ai-source" role="radiogroup" aria-label="Audio source">
          <label><input type="radio" name="ai-source" value="stored" checked> This meeting's recording</label>
          <label><input type="radio" name="ai-source" value="meetily"> Meetily app</label>
          <label><input type="radio" name="ai-source" value="import"> Import</label>
        </div>
        <div class="ai-src-panel" data-src="stored">
          <label class="ai-rec">Recording <select class="input" id="ai-stored"></select></label>
        </div>
        <div class="ai-src-panel" data-src="meetily" style="display:none;">
          <label class="ai-rec">Recording <select class="input" id="ai-recording"></select></label>
        </div>
        <div class="ai-src-panel" data-src="import" style="display:none;">
          <input type="file" id="ai-file" accept="audio/*" aria-label="Import audio file">
        </div>
        <label id="ai-fast-wrap" style="display:none;align-items:center;gap:6px;margin-top:8px;font-size:0.8rem;color:var(--text-2);cursor:pointer;">
          <input type="checkbox" id="ai-fast"> Fast draft — ~5× faster, less accurate (good for a quick pass you'll edit)
        </label>
        <div class="ai-status" id="ai-status" role="status" aria-live="polite"></div>
        <textarea class="textarea ai-minutes" id="ai-minutes" rows="16" placeholder="Generated minutes appear here — review and edit before finalizing." style="display:none;"></textarea>
      </div>
    </div>
  </div>
</div>

<!-- Document -->
<div class="doc-wrap">
  <article class="doc" id="minutes">
    <div class="doc-org" id="d-org">Organization</div>
    <h1 class="doc-title" id="d-title">Meeting Title</h1>
    <div class="doc-meta">Meeting Minutes · <b id="d-date">—</b></div>
    <hr class="rule">
    <div id="d-body"></div>
    <div class="doc-foot">
      <span id="d-foot-org"></span>
      <span>Generated by Quorum</span>
    </div>
  </article>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
<script src="config.js"></script>
<script src="supa.js?v=3"></script>
<script src="ui.js?v=1"></script>
<script src="lib.js?v=2"></script>
<script>
(async function(){
  await requireAuth();
  const me = await currentProfile();
  if (!me || me.role !== 'admin') { location.href = 'team.html'; return; }
  const md = window.markdownit({ html: false, linkify: true, breaks: true });
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  const org = document.getElementById('min-org');
  const title = document.getElementById('min-title');
  const date = document.getElementById('min-date');

  const mParam = new URLSearchParams(location.search).get('meeting');
  const meeting = mParam
    ? ((await supa.from('meetings').select('*').eq('id', mParam).maybeSingle()).data || await selectedMeeting())
    : await selectedMeeting();
  if (!meeting) {
    document.getElementById('d-title').textContent = 'No meeting selected';
    document.getElementById('d-body').innerHTML =
      '<p style="color:#5c6473;">There’s no active meeting to write minutes for. ' +
      '<a href="admin.html" style="color:oklch(41% 0.165 267);font-weight:600;">Open the Admin console</a> to create or pick one.</p>';
    var mf = document.querySelector('.min-fields'); if (mf) mf.style.display = 'none';   // fields/actions do nothing
    var ma = document.querySelector('.min-actions'); if (ma) ma.style.display = 'none';  // without a meeting — hide them
    return;
  }
  org.value = meeting.org || '';
  title.value = meeting.title || '';
  date.value = meeting.meeting_date || '';

  let aiMinutes = null;   // when set, Finalize publishes this instead of the structured minutes
  const genAiBtn = document.getElementById('gen-ai');
  const recSel = document.getElementById('ai-recording');
  const aiWrap = document.getElementById('ai-wrap');
  const aiText = document.getElementById('ai-minutes');
  const aiStatus = document.getElementById('ai-status');

  let importedFile = null;
  const storedSel = document.getElementById('ai-stored');
  function currentSource() { return (document.querySelector('input[name="ai-source"]:checked') || {}).value || 'stored'; }
  function showSourcePanels() {
    const s = currentSource();
    document.querySelectorAll('.ai-src-panel').forEach(p => { p.style.display = p.dataset.src === s ? '' : 'none'; });
    document.getElementById('ai-fast-wrap').style.display = (s === 'stored' || s === 'import') ? 'flex' : 'none';
  }
  document.querySelectorAll('input[name="ai-source"]').forEach(r => r.addEventListener('change', showSourcePanels));

  // "This meeting's recording" — list what was recorded on the Admin page (Supabase storage).
  function recLabel(name) {
    const ts = parseInt((name || '').split('.')[0], 10);
    return isNaN(ts) ? esc(name) : esc(new Date(ts).toLocaleString());
  }
  async function loadStoredRecordings() {
    try {
      const { data, error } = await supa.storage.from('submissions')
        .list('recordings/' + meeting.id, { sortBy: { column: 'name', order: 'desc' } });
      if (error) { storedSel.innerHTML = '<option value="">Couldn’t load recordings — retry</option>'; return; }
      const recs = (data || []).filter(f => f.name && !f.name.startsWith('.'));
      storedSel.innerHTML = recs.length
        ? recs.map(f => '<option value="recordings/' + meeting.id + '/' + esc(f.name) + '">' + recLabel(f.name) + '</option>').join('')
        : '<option value="">No recording yet — record it on the Admin page</option>';
    } catch (e) { storedSel.innerHTML = '<option value="">Couldn’t load recordings</option>'; }
  }

  document.getElementById('ai-file').addEventListener('change', function (e) { importedFile = e.target.files[0] || null; });

  // Always show the AI card. If the local bridge is down, disable Generate and say why
  // (instead of hiding the whole feature with no explanation).
  aiWrap.style.display = '';
  await loadStoredRecordings();                       // Supabase — works with or without the bridge
  let bridgeOk = false;
  try {
    const h = await fetch(window.BRIDGE_URL + '/health', { signal: AbortSignal.timeout(1500) }).then(r => r.json());
    bridgeOk = !!(h && h.ok);
  } catch (e) { bridgeOk = false; }
  if (bridgeOk) {
    try {
      const recs = await fetch(window.BRIDGE_URL + '/recordings', { signal: AbortSignal.timeout(1500) }).then(r => r.json());
      recSel.innerHTML = (recs || []).map(r =>
        '<option value="' + esc(r.id) + '">' + esc(r.title || r.id) + '</option>').join('');
      const m = matchRecording(meeting, recs || []);
      if (m) recSel.value = m.id;
      if (!(recs || []).length) {                    // no Meetily-app recordings → hide that source
        document.querySelector('input[name="ai-source"][value="meetily"]').closest('label').style.display = 'none';
        document.querySelector('.ai-src-panel[data-src="meetily"]').style.display = 'none';
      }
    } catch (e) { /* recordings list failed but bridge is up — generation still works */ }
  } else {
    // Bridge offline: the Meetily source needs it to list, and generation needs it — disable + explain.
    document.querySelector('input[name="ai-source"][value="meetily"]').closest('label').style.display = 'none';
    document.querySelector('.ai-src-panel[data-src="meetily"]').style.display = 'none';
    genAiBtn.disabled = true;
    aiStatus.className = 'ai-status is-err';
    aiStatus.textContent = 'Local generator offline — run run-bridge.command, then reload to generate from a recording.';
  }
  showSourcePanels();

  aiText.addEventListener('input', function () { aiMinutes = aiText.value; });

  genAiBtn.addEventListener('click', async function () {
    const src = currentSource();
    const genLabel = genAiBtn.innerHTML;
    genAiBtn.disabled = true; genAiBtn.textContent = 'Generating…'; aiText.style.display = '';
    aiStatus.className = 'ai-status is-busy';
    aiStatus.textContent = src === 'meetily' ? 'Generating…' : 'Transcribing + generating… (this can take a minute)';
    try {
      let res;
      if (src === 'meetily') {
        res = await fetch(window.BRIDGE_URL + '/generate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ meeting_id: meeting.id, meetily_id: recSel.value, template: meeting.template || null })
        }).then(async r => r.ok ? r.json() : Promise.reject(await r.json()));
      } else {
        let blob, name;
        if (src === 'import') {
          blob = importedFile;
          if (!blob) throw { error: 'Choose an audio file first.' };
          name = blob.name;
        } else {   // stored — pull this meeting's recording from Supabase
          const path = storedSel.value;
          if (!path) throw { error: 'No recording yet — record the meeting on the Admin page.' };
          const url = await signedUrl(path);
          if (url === '#') throw { error: 'Couldn’t load the recording — please try again.' };
          blob = await fetch(url).then(r => { if (!r.ok) throw { error: 'Recording could not be fetched — it may have been removed.' }; return r.blob(); });
          name = path.split('/').pop();
        }
        const fd = new FormData();
        fd.append('meeting_id', meeting.id);
        if (meeting.template) fd.append('template', meeting.template);
        fd.append('audio', blob, name);
        if (document.getElementById('ai-fast').checked) fd.append('fast', '1');
        res = await fetch(window.BRIDGE_URL + '/generate-audio', { method: 'POST', body: fd })
          .then(async r => r.ok ? r.json() : Promise.reject(await r.json()));
      }
      aiMinutes = res.markdown; aiText.value = res.markdown;
      document.getElementById('d-body').innerHTML = md.render(res.markdown);
      const n = res.projects.length;
      aiStatus.className = 'ai-status is-ok';
      aiStatus.textContent = '✓ Generated — ' + n + (n === 1 ? ' project: ' : ' projects: ') + res.projects.join(', ');
    } catch (e) {
      aiStatus.className = 'ai-status is-err';
      aiStatus.textContent = 'Failed: ' + ((e && e.error) || (e && e.message) || 'error');
    } finally {
      genAiBtn.disabled = false;
      genAiBtn.innerHTML = genLabel;
    }
  });

  const { data: teams } = await supa.from('teams').select('*').order('name');
  const { data: notes } = await supa.from('notes').select('team_id, content').eq('meeting_id', meeting.id);
  const noteFor = (id) => (notes.find(n => n.team_id === id) || {}).content || '';
  const isVip = meeting.model === 'admin';   // admin-run: single content block, no team sections
  const vipTeamId = me.team_id;              // VIP content is stored under the admin's own team slot

  function fmtDate(v){
    if(!v) return '—';
    const d = new Date(v + 'T00:00');
    if(isNaN(d)) return v;
    return d.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  }
  function generate(){
    document.getElementById('d-org').textContent = org.value.trim() || 'Organization';
    document.getElementById('d-title').textContent = title.value.trim() || 'Meeting Title';
    document.getElementById('d-date').textContent = fmtDate(date.value);
    document.getElementById('d-foot-org').textContent = org.value.trim();

    let html;
    if (isVip) {
      const c = noteFor(vipTeamId).trim();
      html = c ? md.render(c) : '<p style="color:#5c6473;">No content yet.</p>';
    } else {
      html = '<h2 class="sec">Team updates</h2>';
      (teams || []).forEach(function(t){
        const c = noteFor(t.id).trim();
        html += '<h3 style="font-family:var(--font);font-size:0.9375rem;margin:14px 0 4px;">' + esc(t.name) + '</h3>';
        html += c ? md.render(c) : '<p style="color:#5c6473;">No updates this week.</p>';
      });
    }
    document.getElementById('d-body').innerHTML = html;
  }

  // Markdown snapshot stored for History (rendered there via markdown-it).
  function minutesMarkdown(){
    if (aiMinutes && aiMinutes.trim()) return aiMinutes;
    if (isVip) {
      const out = ['# ' + (title.value || 'Meeting Minutes'), ''];
      if (org.value) out.push('**Organization:** ' + org.value);
      out.push('**Date:** ' + (date.value || ''), '', (noteFor(vipTeamId).trim() || '_No content_'));
      return out.join('\n');
    }
    return buildMinutesMarkdown({
      org: org.value, title: title.value, date: date.value,
      teams: (teams || []).map(t => ({ team: t.name, notes: noteFor(t.id) })),
    });
  }

  [org, title, date].forEach(el => el.addEventListener('input', generate));
  document.getElementById('generate').addEventListener('click', generate);
  // Print / Save PDF is non-destructive — render + print, repeatable, no side effects.
  document.getElementById('print').addEventListener('click', function(){
    generate();
    window.print();
  });
  // Finalize is the deliberate finishing action: save the minutes snapshot AND archive the
  // meeting to History (is_active=false) so it drops off the active list. Confirmed first.
  document.getElementById('finalize').addEventListener('click', async function(){
    generate();
    const ok = await confirmDialog({ title: 'Finalize & archive', body: 'Save these minutes and move the meeting to History? Teams will no longer see it in their active list — you can still find it in History.', confirmText: 'Finalize & archive' });
    if (!ok) return;
    const { error } = await supa.from('meetings').update({ minutes_final: minutesMarkdown(), is_active: false }).eq('id', meeting.id);
    if (error) { console.error(error); toast('Couldn’t finalize the minutes — please try again.', 'error'); return; }
    clearSelectedMeeting();
    toast('Minutes finalized — moved to History', 'ok');
  });

  generate();
})();
</script>
</body>
</html>
