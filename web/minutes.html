<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minutes · MeeTeam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

<!-- Control bar (not printed) -->
<div class="min-bar no-print">
  <div class="container">
    <div class="min-bar-top">
      <a class="brand" href="admin.html">
        <svg class="mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#3b4dd8"/>
          <circle cx="12.6" cy="16" r="5.4" fill="#fff"/>
          <circle cx="19.4" cy="16" r="5.4" fill="#fff" fill-opacity=".55"/>
        </svg>
        <span>MeeTeam</span>
      </a>
      <span class="context"><span class="team">Meeting minutes</span><span class="meeting">Draft &amp; export</span></span>
      <span class="spacer"></span>
      <div class="min-actions">
        <button class="btn btn-ghost" id="generate" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 8-8 8 8 0 0 1 5.7 2.4L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-8 8 8 8 0 0 1-5.7-2.4L4 16"/><path d="M4 20v-4h4"/></svg>
          Generate
        </button>
        <button class="btn btn-primary" id="print" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="6" y="13" width="12" height="8"/><path d="M6 17H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"/></svg>
          Print / Save PDF
        </button>
      </div>
    </div>
    <div class="min-fields">
      <div class="field">
        <label class="label" for="min-org">Organization</label>
        <input class="input" type="text" id="min-org" value="">
      </div>
      <div class="field">
        <label class="label" for="min-title">Meeting title</label>
        <input class="input" type="text" id="min-title" value="">
      </div>
      <div class="field">
        <label class="label" for="min-date">Date</label>
        <input class="input" type="date" id="min-date" value="">
      </div>
      <div class="field decisions-field">
        <label class="label" for="decisions">Decisions <span style="color:var(--text-3);font-weight:500;">— one per line</span></label>
        <textarea class="textarea" id="decisions" rows="3" placeholder="One decision per line…"></textarea>
      </div>
    </div>
  </div>
</div>

<!-- Document -->
<div class="doc-wrap">
  <article class="doc" id="minutes">
    <div class="doc-org" id="d-org">Organization</div>
    <h1 class="doc-title" id="d-title">Meeting Title</h1>
    <div class="doc-meta">Meeting Minutes · <b id="d-date">—</b></div>
    <hr class="rule">
    <div id="d-body"></div>
    <div class="doc-foot">
      <span id="d-foot-org"></span>
      <span>Generated by MeeTeam</span>
    </div>
  </article>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
<script src="config.js"></script>
<script src="supa.js?v=2"></script>
<script src="lib.js?v=2"></script>
<script>
(async function(){
  await requireAuth();
  const me = await currentProfile();
  if (!me || me.role !== 'admin') { location.href = 'team.html'; return; }
  const md = window.markdownit({ html: false, linkify: true, breaks: true });
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  const org = document.getElementById('min-org');
  const title = document.getElementById('min-title');
  const date = document.getElementById('min-date');
  const dec = document.getElementById('decisions');

  const mParam = new URLSearchParams(location.search).get('meeting');
  const meeting = mParam
    ? ((await supa.from('meetings').select('*').eq('id', mParam).maybeSingle()).data || await selectedMeeting())
    : await selectedMeeting();
  if (!meeting) { document.getElementById('d-title').textContent = 'No active meeting'; return; }
  org.value = meeting.org || '';
  title.value = meeting.title || '';
  date.value = meeting.meeting_date || '';

  const { data: teams } = await supa.from('teams').select('*').order('name');
  const { data: notes } = await supa.from('notes').select('team_id, content').eq('meeting_id', meeting.id);
  const noteFor = (id) => (notes.find(n => n.team_id === id) || {}).content || '';
  const isVip = meeting.model === 'admin';   // admin-run: single content block, no team sections
  const vipTeamId = me.team_id;              // VIP content is stored under the admin's own team slot

  function fmtDate(v){
    if(!v) return '—';
    const d = new Date(v + 'T00:00');
    if(isNaN(d)) return v;
    return d.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  }
  function decisionLines(){ return (dec.value || '').split('\n').map(s => s.replace(/^[-•\s]+/, '').trim()).filter(Boolean); }

  function generate(){
    document.getElementById('d-org').textContent = org.value.trim() || 'Organization';
    document.getElementById('d-title').textContent = title.value.trim() || 'Meeting Title';
    document.getElementById('d-date').textContent = fmtDate(date.value);
    document.getElementById('d-foot-org').textContent = org.value.trim();

    let html;
    if (isVip) {
      const c = noteFor(vipTeamId).trim();
      html = c ? md.render(c) : '<p style="color:#7a808f;">No content yet.</p>';
    } else {
      html = '<h3 class="sec">Team updates</h3>';
      (teams || []).forEach(function(t){
        const c = noteFor(t.id).trim();
        html += '<h4 style="font-family:var(--font);margin:14px 0 4px;">' + esc(t.name) + '</h4>';
        html += c ? md.render(c) : '<p style="color:#7a808f;">No updates this week.</p>';
      });
    }
    html += '<h3 class="sec">Decisions</h3>';
    const lines = decisionLines();
    html += lines.length
      ? '<ul>' + lines.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul>'
      : '<p style="color:#7a808f;">No decisions were recorded.</p>';
    document.getElementById('d-body').innerHTML = html;
  }

  // Markdown snapshot stored for History (rendered there via markdown-it).
  function minutesMarkdown(){
    if (isVip) {
      const out = ['# ' + (title.value || 'Meeting Minutes'), ''];
      if (org.value) out.push('**Organization:** ' + org.value);
      out.push('**Date:** ' + (date.value || ''), '', (noteFor(vipTeamId).trim() || '_No content_'),
        '', '## Decisions', '', (dec.value.trim() || '_None recorded_'));
      return out.join('\n');
    }
    return buildMinutesMarkdown({
      org: org.value, title: title.value, date: date.value,
      teams: (teams || []).map(t => ({ team: t.name, notes: noteFor(t.id) })),
      decisions: dec.value,
    });
  }

  [org, title, date, dec].forEach(el => el.addEventListener('input', generate));
  document.getElementById('generate').addEventListener('click', generate);
  document.getElementById('print').addEventListener('click', async function(){
    generate();
    // Exporting finalizes the meeting: save the minutes snapshot AND archive it to
    // History (is_active=false), so it drops off the active list automatically.
    await supa.from('meetings').update({ minutes_final: minutesMarkdown(), is_active: false }).eq('id', meeting.id);
    clearSelectedMeeting();
    window.print();
  });

  generate();
})();
</script>
</body>
</html>
