<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team history · MeeTeam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <header class="topbar no-print">
    <div class="container topbar-inner">
      <a class="brand" href="team.html">
        <svg class="mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#3b4dd8"/>
          <circle cx="12.6" cy="16" r="5.4" fill="#fff"/>
          <circle cx="19.4" cy="16" r="5.4" fill="#fff" fill-opacity=".55"/>
        </svg>
        <span>MeeTeam</span>
      </a>
      <div class="context">
        <span class="team" id="team-name">Your team</span>
        <span class="meeting">Meeting history</span>
      </div>
      <span class="spacer"></span>
      <a class="btn btn-ghost" href="team.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Back to dashboard
      </a>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <div class="grid-head no-print">
        <div>
          <div class="page-title">Meeting history</div>
          <div class="page-sub">Look back at past meetings — your submissions and the final minutes.</div>
        </div>
      </div>

      <div class="history-layout">
        <!-- Meeting list -->
        <aside class="history-side no-print">
          <div class="subhead" style="padding-left:2px;">Past meetings</div>
          <ul class="hlist" id="history-list"></ul>
        </aside>

        <!-- Detail -->
        <div id="history-detail">
          <div class="part">
            <section class="card">
              <div class="card-head">
                <div class="card-titles">
                  <span class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                    Your submitted notes
                  </span>
                  <span class="card-sub" id="detail-meeting-label">—</span>
                </div>
              </div>
              <div class="card-body"><div class="md" id="history-notes"></div></div>
            </section>
          </div>

          <div class="part">
            <section class="card">
              <div class="card-head">
                <span class="card-title">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h5l2 2h9v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
                  Your submitted files
                </span>
              </div>
              <div class="card-body"><div class="stack" id="history-files"></div></div>
            </section>
          </div>

          <div class="part part-minutes">
            <section class="card">
              <div class="card-head">
                <span class="card-title">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
                  Final minutes
                </span>
                <button class="btn btn-ghost no-print" id="save-pdf" type="button">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="6" y="13" width="12" height="8"/><path d="M6 17H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"/></svg>
                  Save PDF
                </button>
              </div>
              <div class="card-body"><div class="md" id="history-minutes"></div></div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
<script src="config.js"></script>
<script src="supa.js"></script>
<script>
(async function(){
  await requireAuth();
  const me = await currentProfile();
  const isAdmin = me && me.role === 'admin';
  const md = window.markdownit({ html: false, linkify: true, breaks: true });
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function fileIcon(name){
    var img = /\.(png|jpe?g|gif|webp|svg|heic|bmp|fig)$/i.test(name);
    return img
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m5 18 5-5 4 4 2-2 3 3"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
  }
  async function fileLink(f){
    const url = await signedUrl(f.file_path);
    return '<a class="detail-file" href="' + url + '" target="_blank" rel="noopener">' +
      '<span class="fico">' + fileIcon(f.file_name) + '</span>' +
      '<span class="fmeta"><span class="fname">' + esc(f.file_name) + '</span></span>' +
      '<span class="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg></span></a>';
  }

  // Admin sees all teams; a member sees only their own. Adjust labels + nav accordingly.
  document.getElementById('team-name').textContent = isAdmin ? 'All teams · admin' : (me.teams ? me.teams.name : 'Your team');
  if (isAdmin) {
    document.querySelectorAll('.brand, a.btn.btn-ghost[href="team.html"]').forEach(a => { a.href = 'admin.html'; });
    const titles = document.querySelectorAll('#history-detail .card-title');
    [['Team notes', titles[0]], ['Team files', titles[1]]].forEach(([label, el]) => {
      if (!el) return; const svg = el.querySelector('svg'); el.textContent = '';
      if (svg) el.appendChild(svg); el.appendChild(document.createTextNode(' ' + label));
    });
  }

  const listEl    = document.getElementById('history-list');
  const notesEl   = document.getElementById('history-notes');
  const filesEl   = document.getElementById('history-files');
  const minutesEl = document.getElementById('history-minutes');
  const labelEl   = document.getElementById('detail-meeting-label');

  const { data: meetings } = await supa.from('meetings').select('*')
    .eq('is_active', false).order('created_at', { ascending: false });
  const { data: teams } = await supa.from('teams').select('*').order('name');
  // Admin: all teams' notes/files (RLS admin-read). Member: own team only.
  let notesQ = supa.from('notes').select('*');
  let subsQ = supa.from('submissions').select('*');
  if (!isAdmin) { notesQ = notesQ.eq('team_id', me.team_id); subsQ = subsQ.eq('team_id', me.team_id); }
  const { data: allNotes } = await notesQ;
  const { data: allSubs } = await subsQ;
  const subsOfMeeting = (mid) => (allSubs || []).filter(s => s.meeting_id === mid);
  const teamName = (id) => ((teams || []).find(t => t.id === id) || {}).name || 'Team';

  if (!meetings || !meetings.length) {
    listEl.innerHTML = '<li class="muted-note" style="padding:12px;">No past meetings yet.</li>';
    labelEl.textContent = '—';
    notesEl.innerHTML = filesEl.innerHTML = minutesEl.innerHTML = '<div class="muted-note">Nothing here yet.</div>';
    return;
  }

  async function select(idx){
    const m = meetings[idx];
    Array.prototype.forEach.call(listEl.children, (li, k) => li.classList.toggle('active', k === idx));
    labelEl.textContent = m.title + (m.meeting_date ? ' · ' + m.meeting_date : '');
    const mNotes = (allNotes || []).filter(n => n.meeting_id === m.id);
    const mSubs = subsOfMeeting(m.id);

    if (isAdmin) {
      // group notes + files by team
      let nHtml = '', fHtml = '';
      for (const t of (teams || [])) {
        const n = mNotes.find(x => x.team_id === t.id) || {};
        nHtml += '<h4>' + esc(t.name) + '</h4>' +
          md.render(n.content && n.content.trim() ? n.content : '_No notes_');
        const tf = mSubs.filter(s => s.team_id === t.id);
        if (tf.length) { fHtml += '<h4>' + esc(t.name) + '</h4>'; for (const f of tf) fHtml += await fileLink(f); }
      }
      notesEl.innerHTML = nHtml;
      filesEl.innerHTML = fHtml || '<div class="muted-note">No files were submitted.</div>';
    } else {
      const n = mNotes[0] || {};
      notesEl.innerHTML =
        '<h4>Meeting notes</h4>' + md.render(n.content && n.content.trim() ? n.content : '_No notes were submitted._') +
        '<h4>Pre-meeting note</h4>' + md.render(n.pre_note && n.pre_note.trim() ? n.pre_note : '_None._');
      if (mSubs.length) { let h = ''; for (const f of mSubs) h += await fileLink(f); filesEl.innerHTML = h; }
      else filesEl.innerHTML = '<div class="muted-note">No files were submitted.</div>';
    }

    minutesEl.innerHTML = m.minutes_final ? md.render(m.minutes_final)
      : '<div class="muted-note">Minutes were not finalized for this meeting.</div>';
  }

  meetings.forEach((m, idx) => {
    const li = document.createElement('li');
    li.className = 'hitem';
    li.innerHTML = '<div class="htitle">' + esc(m.title) + '</div>' +
      '<div class="hdate">' + esc(m.meeting_date || '') + '</div>' +
      '<div class="hmeta"><span>' + subsOfMeeting(m.id).length + ' files</span><span>' +
      (m.minutes_final ? 'minutes' : 'no minutes') + '</span></div>';
    li.addEventListener('click', () => select(idx));
    listEl.appendChild(li);
  });

  select(0);

  document.getElementById('save-pdf').addEventListener('click', function(){
    document.body.classList.add('only-minutes');
    window.print();
  });
  window.addEventListener('afterprint', function(){ document.body.classList.remove('only-minutes'); });
})();
</script>
</body>
</html>
