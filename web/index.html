<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Quorum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="theme.js?v=2"></script>
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <main class="auth">
    <div class="auth-card">
      <div class="auth-brand">
        <svg class="mark" width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#3b4dd8"/>
          <circle cx="12.6" cy="16" r="5.4" fill="#fff"/>
          <circle cx="19.4" cy="16" r="5.4" fill="#fff" fill-opacity=".55"/>
        </svg>
        <span>Quorum</span>
      </div>

      <h1>Sign in to Quorum</h1>
      <p class="sub">Enter your email and password. New here? Your account is created automatically — if you were invited to a team, you'll land right on it.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label class="label" for="email">Work email</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" autofocus>
        </div>
        <div class="field">
          <label class="label" for="password">Password</label>
          <input class="input" type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in / Create account</button>
        <p style="text-align:center;margin-top:12px;"><a href="#" id="forgot-link" style="font-size:0.8125rem;color:var(--text-2);text-decoration:none;">Forgot password?</a></p>
      </form>

      <p class="auth-msg" id="login-msg" role="status" aria-live="polite">We'll never share your email.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supa.js?v=3"></script>
  <script src="auth.js?v=2"></script>
</body>
</html>
