<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · MeeTeam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <main class="auth">
    <div class="auth-card">
      <div class="auth-brand">
        <svg class="mark" width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#3b4dd8"/>
          <circle cx="12.6" cy="16" r="5.4" fill="#fff"/>
          <circle cx="19.4" cy="16" r="5.4" fill="#fff" fill-opacity=".55"/>
        </svg>
        <span>MeeTeam</span>
      </div>

      <h1>Sign in to MeeTeam</h1>
      <p class="sub">Enter your work email and we'll send you a secure login link — no password needed.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label class="label" for="email">Work email</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" autofocus>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Send me a login link</button>
      </form>

      <p class="auth-msg" id="login-msg" role="status" aria-live="polite">We'll never share your email.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supa.js?v=2"></script>
  <script src="auth.js"></script>
</body>
</html>
